name: Homebrew tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  checks: read
  contents: read
  packages: read
  pull-requests: read

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"

jobs:
  macos-26:
    name: macos-26
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Set up Homebrew
        id: setup-homebrew
        uses: Homebrew/actions/setup-homebrew@18fcb8e3e06b4247c676c506750dc95ea7226479 # 2026.07.13.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup-homebrew.outputs.gems-path }}
          key: macos-arm64-rubygems-${{ steps.setup-homebrew.outputs.gems-hash }}
          restore-keys: macos-arm64-rubygems-

      - name: Prepare test-bot
        run: |
          brew test-bot --only-cleanup-before
          brew test-bot --only-setup

      - name: Test release metadata updater
        run: ruby test/update_pdf_test.rb

      - name: Check tap syntax
        run: brew test-bot --only-tap-syntax

      - name: Audit Formula
        if: ${{ hashFiles('Formula/pdf.rb') != '' }}
        run: brew audit --strict --online signed-page/tap/pdf

      - name: Install native bottle
        if: ${{ hashFiles('Formula/pdf.rb') != '' }}
        run: brew install --force-bottle signed-page/tap/pdf

      - name: Test Formula
        if: ${{ hashFiles('Formula/pdf.rb') != '' }}
        run: brew test signed-page/tap/pdf

      - name: Run installed executable
        if: ${{ hashFiles('Formula/pdf.rb') != '' }}
        run: pdf-sign --help

  ubuntu-24-04:
    name: ubuntu-24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/homebrew/brew:main # zizmor: ignore[unpinned-images]
      options: --privileged
    steps:
      - name: Set up Homebrew
        id: setup-homebrew
        uses: Homebrew/actions/setup-homebrew@18fcb8e3e06b4247c676c506750dc95ea7226479 # 2026.07.13.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup-homebrew.outputs.gems-path }}
          key: linux-amd64-rubygems-${{ steps.setup-homebrew.outputs.gems-hash }}
          restore-keys: linux-amd64-rubygems-

      - name: Prepare test-bot
        run: |
          brew test-bot --only-cleanup-before
          brew test-bot --only-setup

      - name: Check tap syntax
        run: brew test-bot --only-tap-syntax

      - name: Audit Formula
        if: ${{ hashFiles('Formula/pdf.rb') != '' }}
        run: brew audit --strict --online signed-page/tap/pdf

      - name: Install native bottle
        if: ${{ hashFiles('Formula/pdf.rb') != '' }}
        run: brew install --force-bottle signed-page/tap/pdf

      - name: Test Formula
        if: ${{ hashFiles('Formula/pdf.rb') != '' }}
        run: brew test signed-page/tap/pdf

      - name: Run installed executable
        if: ${{ hashFiles('Formula/pdf.rb') != '' }}
        run: pdf-sign --help

  ubuntu-24-04-arm:
    name: ubuntu-24.04-arm
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    container:
      image: ghcr.io/homebrew/brew:main # zizmor: ignore[unpinned-images]
      options: --privileged
    steps:
      - name: Set up Homebrew
        id: setup-homebrew
        uses: Homebrew/actions/setup-homebrew@18fcb8e3e06b4247c676c506750dc95ea7226479 # 2026.07.13.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup-homebrew.outputs.gems-path }}
          key: linux-arm64-rubygems-${{ steps.setup-homebrew.outputs.gems-hash }}
          restore-keys: linux-arm64-rubygems-

      - name: Prepare test-bot
        run: |
          brew test-bot --only-cleanup-before
          brew test-bot --only-setup

      - name: Check tap syntax
        run: brew test-bot --only-tap-syntax

      - name: Audit Formula
        if: ${{ hashFiles('Formula/pdf.rb') != '' }}
        run: brew audit --strict --online signed-page/tap/pdf

      - name: Install native bottle
        if: ${{ hashFiles('Formula/pdf.rb') != '' }}
        run: brew install --force-bottle signed-page/tap/pdf

      - name: Test Formula
        if: ${{ hashFiles('Formula/pdf.rb') != '' }}
        run: brew test signed-page/tap/pdf

      - name: Run installed executable
        if: ${{ hashFiles('Formula/pdf.rb') != '' }}
        run: pdf-sign --help
